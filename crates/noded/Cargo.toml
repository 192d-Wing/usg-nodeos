[package]
name = "noded"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# FIPS-validated crypto (aws-lc-rs FIPS module) for both the mTLS server and the
# EST client. On by default; building it requires the FIPS toolchain (cmake + Go
# + C/C++). Use `--no-default-features` on dev boxes/CI that lack that toolchain.
default = ["fips"]
fips = ["usg-est-client/fips", "rustls/fips"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
der.workspace = true
hyper-util.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
yaml_serde.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# `pkcs11` brings the crate's TPM/HSM KeyProvider, rustls PKCS#11 signer, and
# client-cert resolver (used for the optional TPM-resident node key). It is
# always compiled; the TPM path is selected at runtime via `tpm` in the config.
usg-est-client = { workspace = true, features = ["pkcs11"] }
x509-cert.workspace = true
# PKCS#11 token provisioning (C_InitToken/C_InitPIN) for the TPM-resident key:
# the crate's Pkcs11KeyProvider assumes an already-initialized token, and the
# image has no Python/tpm2_ptool. Match the crate's cryptoki version.
cryptoki = "0.12"
rand = "0.9"

[dev-dependencies]
tempfile = "3.27"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6.5"
