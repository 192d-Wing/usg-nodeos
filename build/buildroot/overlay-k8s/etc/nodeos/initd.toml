requiredDirs = [
  "/run",
  "/tmp",
  "/var/lib/nodeos",
  "/var/lib/kubelet",
  "/var/lib/containerd",
  "/var/log",
]

# Bring up loopback (so the API can bind ::1) and the primary NIC; the kernel
# then autoconfigures IPv6 on eth0 via SLAAC (router advertisements).
interfaces = ["lo", "eth0"]

[[mounts]]
source = "devtmpfs"
target = "/dev"
fstype = "devtmpfs"
flags = ["nosuid"]
data = "mode=0755"

[[mounts]]
source = "proc"
target = "/proc"
fstype = "proc"
flags = ["nodev", "nosuid", "noexec"]

[[mounts]]
source = "sysfs"
target = "/sys"
fstype = "sysfs"
flags = ["nodev", "nosuid", "noexec"]

# cgroup v2 unified hierarchy: containerd + kubelet require it, and with no
# systemd nothing else mounts it. Must be mounted after /sys.
[[mounts]]
source = "cgroup2"
target = "/sys/fs/cgroup"
fstype = "cgroup2"
flags = ["nodev", "nosuid", "noexec"]

# CNI config dir: writable tmpfs over the read-only root so the cluster's CNI
# (Cilium DaemonSet) can drop its conflist here at runtime. The plugin binaries
# ship read-only in /opt/cni/bin; only the config dir needs to be writable.
[[mounts]]
source = "cni-conf"
target = "/etc/cni/net.d"
fstype = "tmpfs"
flags = ["nodev", "nosuid"]
data = "mode=0755,size=1m"

[[mounts]]
source = "run"
target = "/run"
fstype = "tmpfs"
flags = ["nodev", "nosuid", "noexec"]
data = "mode=0755,size=64m"

[[mounts]]
source = "tmp"
target = "/tmp"
fstype = "tmpfs"
flags = ["nodev", "nosuid", "noexec"]
data = "mode=1777,size=128m"

[[mounts]]
source = "kubelet-state"
target = "/var/lib/kubelet"
fstype = "tmpfs"
flags = ["nodev", "nosuid"]
data = "mode=0750,size=256m"

[[mounts]]
source = "logs"
target = "/var/log"
fstype = "tmpfs"
flags = ["nodev", "nosuid", "noexec"]
data = "mode=0755,size=128m"

# Persistent node-state volume: holds the enrolled PKI across reboots so the
# node bootstraps once and renews thereafter. LUKS2-encrypted with the key held
# in the TPM (NV index); formatted ext4 on first boot. vda1 is the ESP (UEFI
# boot), vda2 is this state partition.
[[disks]]
device = "/dev/vda2"
target = "/var/lib/nodeos"
fstype = "ext4"
flags = ["nodev", "nosuid"]
formatIfEmpty = true
mkfs = ["/sbin/mkfs.ext4", "-q", "-F"]
# pcrs binds the key to measured boot: PCR 4 = the EFI-stub kernel (with its
# embedded initramfs + cmdline) that OVMF loaded; PCR 7 = secure-boot state.
# The volume only unlocks when these match the provisioning-time values.
encrypt = { name = "nodeos-state", tpmNvIndex = "0x01500001", pcrs = "sha256:4,7" }

# Persistent container-image/runtime volume (k8s): containerd's image store +
# snapshots survive reboots (no re-pull each boot — essential for airgap/scale).
# Same LUKS-via-TPM measured-boot model as the state volume, on vda3 with a
# distinct NV index. Formatted ext4 on first boot.
[[disks]]
device = "/dev/vda3"
target = "/var/lib/containerd"
fstype = "ext4"
flags = ["nodev", "nosuid"]
formatIfEmpty = true
mkfs = ["/sbin/mkfs.ext4", "-q", "-F"]
encrypt = { name = "nodeos-data", tpmNvIndex = "0x01500002", pcrs = "sha256:4,7" }

# containerd first: its CRI socket gates dependent services (kubelet). readyWhen
# makes initd wait for the socket before starting the next service.
# /run/containerd lives on the /run tmpfs; config.toml configures CRI (cgroupfs,
# pause image, CNI dirs) and redirects the managed-opt dir to writable storage.
[[services]]
name = "containerd"
command = "/usr/bin/containerd"
args = ["--config", "/etc/containerd/config.toml"]
restart = "always"
readyWhen = "/run/containerd/containerd.sock"
readyTimeoutSecs = 30

[[services]]
name = "noded"
command = "/usr/bin/noded"
args = ["/etc/nodeos/noded.yaml"]
restart = "always"

# kubelet last, and deferred: startWhen holds it until noded has rendered the
# bootstrap-kubeconfig from a PUT /v1/config (an unconfigured node simply does not
# run kubelet). kubelet then TLS-bootstraps its own client cert and registers.
# --node-ip is omitted; kubelet auto-detects the SLAAC IPv6 (validated live).
# --hostname-override is the node FQDN, substituted from .env by post-build.sh.
[[services]]
name = "kubelet"
command = "/usr/bin/kubelet"
args = [
  "--config", "/var/lib/nodeos/k8s/kubelet/config.yaml",
  "--bootstrap-kubeconfig", "/var/lib/nodeos/k8s/kubelet/bootstrap-kubeconfig",
  "--kubeconfig", "/var/lib/kubelet/kubeconfig",
  "--cert-dir", "/var/lib/kubelet/pki",
  "--container-runtime-endpoint", "unix:///run/containerd/containerd.sock",
  "--register-node",
  "--hostname-override", "qemu-node-001.example.com",
]
restart = "always"
startWhen = "/var/lib/nodeos/k8s/kubelet/bootstrap-kubeconfig"
