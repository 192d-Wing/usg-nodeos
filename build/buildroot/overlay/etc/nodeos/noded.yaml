listenAddr: "[::1]:9443"
nodeId: qemu-node-001.example.com
# Enrolled identity lives on writable state (the root filesystem is read-only).
# Only the baked-in EST trust anchor (caCertFile) stays under read-only /etc.
certFile: /var/lib/nodeos/pki/server.crt
# keyFile is unused when `tpm` is set (the private key lives in the TPM); it is
# still required by the config schema and used by the software (non-TPM) path.
keyFile: /var/lib/nodeos/pki/server.key
clientCa: /var/lib/nodeos/pki/client-ca.crt
# TPM-resident node key (tpm2-pkcs11): the EST key pair is generated in and never
# leaves the TPM. The token store + PIN live on the LUKS+PCR-sealed state volume,
# so the key is usable only after an untampered measured boot. Remove this block
# to fall back to a software key written under certFile/keyFile.
tpm:
  library: /usr/lib/libtpm2_pkcs11.so
  store: /var/lib/nodeos/pkcs11
  tokenLabel: nodeos
  keyLabel: nodeos-est-key
  pinFile: /var/lib/nodeos/pki/pkcs11.pin
  tcti: device:/dev/tpmrm0
enrollment:
  est:
    # Base EST server URL. The client appends /.well-known/est/<operation>.
    # IPv6-only node: resolved via the AAAA record (est.example.com ->
    # 2001:db8::61). Requires DNS + IPv6 egress on the node network. Replace with
    # your EST server.
    serverUrl: https://est.example.com
    # Bootstrap-only token for the node. Short-lived secret — do not commit;
    # inject per-deployment and rotate after enrollment.
    bearerToken: replace-with-bootstrap-token
    caCertFile: /etc/nodeos/pki/est-ca.crt
    # Optional RFC 7030 CA label. When set the client uses
    # /.well-known/est/<label>/<operation>; omit it for the unlabeled endpoints.
    # label: issuing-ca
  # How often the live renewal loop checks the node certificate's expiry
  # (seconds). Optional; defaults to 3600. Renewal triggers at 2/3 of lifetime.
  # renewCheckIntervalSecs: 3600
# Role-based authorization for the management API. Subjects are the Common Name
# of the management client certificate. Roles are hierarchical:
# viewer < operator < maintainer < breakglass. Deny-by-default: a subject with
# no binding is refused any endpoint that requires a role.
# authorization:
#   roles:
#     - role: operator
#       subjects: ["mgmt-operator-01"]
#     - role: breakglass
#       subjects: ["break-glass-01"]
